[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "smok-harness"
version = "0.12.1"
description = "A local-first, model-agnostic coding harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpcore>=1.0,<2",
  "httpx>=0.28,<1",
  "httpx2>=2.14,<3",
  "jsonschema>=4.23,<5",
  "prompt-toolkit>=3.0.48,<4",
  "pyyaml>=6.0.2,<7",
  "rich>=13.9,<15",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "mcp>=2.3,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pillow>=11,<13",
]

[project.optional-dependencies]
lsp = ["python-lsp-server[pyflakes]>=1.12,<2"]

[project.urls]
Repository = "https://github.com/Mpawlowski5467/smok"
Documentation = "https://github.com/Mpawlowski5467/smok/blob/main/docs/README.md"
Issues = "https://github.com/Mpawlowski5467/smok/issues"

[project.scripts]
smok = "smok.cli:main"
smok-gui = "smok.gui.launcher:main"

[dependency-groups]
desktop = [
    "pyinstaller>=6.15,<7",
]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/smok"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
